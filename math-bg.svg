<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="#ffffff" fill-opacity="0.13" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="30" y="70" font-size="54">∑</text>
    <text x="150" y="50" font-size="26">a² + b² = c²</text>
    <text x="400" y="80" font-size="60">π</text>
    <text x="500" y="150" font-size="44">∫</text>
    <text x="60" y="170" font-size="30">e^(iπ) + 1 = 0</text>
    <text x="300" y="150" font-size="50">√x</text>
    <text x="30" y="270" font-size="56">∞</text>
    <text x="140" y="250" font-size="26">x = (−b ± √(b² − 4ac)) / 2a</text>
    <text x="440" y="270" font-size="52">θ</text>
    <text x="250" y="340" font-size="28">lim (1 + 1/n)ⁿ = e</text>
    <text x="40" y="365" font-size="48">Δ</text>
    <text x="500" y="370" font-size="40">≠ ≈ ≤</text>
  </g>
</svg>
